<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>中建智慧安全平台 — 交互式项目架构全景图</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  :root {
    --bg:#0b1120; --panel:#151e32; --text:#e2e8f0; --muted:#94a3b8;
    --ext:#3b82f6; --store:#f59e0b; --infra:#ec4899; --core:#6366f1;
    --schema:#a855f7; --domain:#22c55e; --svc:#f97316; --api:#14b8a6; --fe:#ef4444;
    --line:rgba(148,163,184,0.25); --active-line:#38bdf8;
  }
  html,body { width:100%; height:100%; overflow:hidden; font-family:'Microsoft YaHei','PingFang SC',system-ui,-apple-system,sans-serif; background:var(--bg); color:var(--text); }

  /* 顶部工具栏 */
  .toolbar { position:fixed; top:0; left:0; right:0; height:56px; background:rgba(11,17,32,0.92); backdrop-filter:blur(16px); border-bottom:1px solid rgba(148,163,184,0.12); display:flex; align-items:center; justify-content:space-between; padding:0 20px; z-index:1000; }
  .toolbar h1 { font-size:16px; font-weight:700; display:flex; align-items:center; gap:10px; letter-spacing:0.3px; }
  .toolbar h1 .dot { width:8px; height:8px; border-radius:50%; background:#22c55e; box-shadow:0 0 8px #22c55e; animation:pulse 2s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.5} }
  .toolbar .controls { display:flex; gap:8px; align-items:center; }
  .toolbar button { background:rgba(148,163,184,0.1); border:1px solid rgba(148,163,184,0.2); color:var(--text); padding:6px 14px; border-radius:8px; cursor:pointer; font-size:12.5px; transition:all .18s; display:flex; align-items:center; gap:5px; }
  .toolbar button:hover { background:rgba(148,163,184,0.2); border-color:rgba(148,163,184,0.35); }
  .toolbar button.active { background:rgba(56,189,248,0.15); border-color:#38bdf8; color:#38bdf8; }
  .zoom-display { font-size:12px; color:var(--muted); min-width:50px; text-align:center; font-variant-numeric:tabular-nums; }

  /* 左侧面板 */
  .sidebar-left { position:fixed; left:16px; top:72px; width:200px; background:var(--panel); border:1px solid rgba(148,163,184,0.1); border-radius:14px; padding:16px; z-index:999; max-height:calc(100vh - 100px); overflow-y:auto; }
  .sidebar-left h3 { font-size:12.5px; color:var(--muted); text-transform:uppercase; letter-spacing:1px; margin-bottom:12px; font-weight:600; }
  .legend-item { display:flex; align-items:center; gap:10px; padding:7px 8px; border-radius:8px; cursor:pointer; transition:background .15s; margin-bottom:2px; font-size:12.5px; }
  .legend-item:hover { background:rgba(148,163,184,0.08); }
  .legend-item.hidden { opacity:0.4; }
  .legend-color { width:14px; height:14px; border-radius:4px; flex-shrink:0; border:2px solid transparent; }

  /* 右侧面板 */
  .sidebar-right { position:fixed; right:-420px; top:56px; width:400px; height:calc(100vh - 56px); background:var(--panel); border-left:1px solid rgba(148,163,184,0.1); z-index:998; transition:right .35s cubic-bezier(.4,0,.2,1); overflow-y:auto; padding:24px; }
  .sidebar-right.open { right:0; }
  .sidebar-right .close-btn { position:absolute; top:16px; right:16px; width:32px; height:32px; border-radius:8px; background:rgba(148,163,184,0.1); border:1px solid rgba(148,163,184,0.15); color:var(--text); cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:16px; transition:all .15s; }
  .sidebar-right .close-btn:hover { background:rgba(148,163,184,0.2); }
  .detail-header { padding-bottom:16px; border-bottom:1px solid rgba(148,163,184,0.1); margin-bottom:16px; }
  .detail-tag { display:inline-block; padding:3px 10px; border-radius:6px; font-size:11px; font-weight:600; margin-bottom:10px; }
  .detail-title { font-size:18px; font-weight:700; margin-bottom:6px; }
  .detail-desc { font-size:13px; color:var(--muted); line-height:1.6; }
  .detail-section { margin-top:20px; }
  .detail-section h4 { font-size:12.5px; color:var(--muted); text-transform:uppercase; letter-spacing:0.8px; margin-bottom:10px; font-weight:600; }
  .detail-list { list-style:none; }
  .detail-list li { padding:8px 12px; background:rgba(148,163,184,0.05); border-radius:8px; margin-bottom:6px; font-size:12.5px; line-height:1.5; border-left:3px solid transparent; transition:background .15s; }
  .detail-list li:hover { background:rgba(148,163,184,0.1); }

  /* 视口和画布 */
  .viewport { position:fixed; top:56px; left:0; right:0; bottom:0; overflow:hidden; cursor:grab; background: radial-gradient(circle at 1px 1px, rgba(148,163,184,0.07) 1px, transparent 0); background-size:24px 24px; }
  .viewport.grabbing { cursor:grabbing; }
  .canvas { position:absolute; top:0; left:0; transform-origin:0 0; padding:60px 80px; min-width:100%; min-height:100%; }

  /* SVG连线层 */
  .connections { position:absolute; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:1; }
  .conn-path { fill:none; stroke-width:1.5; opacity:0.35; transition:all .3s; }
  .conn-path.highlight { stroke-width:2.5; opacity:0.9; filter:drop-shadow(0 0 3px currentColor); }
  .conn-path.dim { opacity:0.08; }
  .conn-label { font-size:10px; fill:var(--muted); opacity:0.5; text-anchor:middle; pointer-events:none; }

  /* 层 */
  .layer { position:relative; z-index:2; margin-bottom:44px; display:flex; flex-direction:column; align-items:center; }
  .layer-title { font-size:11px; font-weight:700; letter-spacing:2px; text-transform:uppercase; color:var(--muted); margin-bottom:14px; padding:4px 16px; border-radius:20px; background:rgba(148,163,184,0.06); border:1px solid rgba(148,163,184,0.08); }
  .layer-nodes { display:flex; flex-wrap:wrap; justify-content:center; gap:12px; max-width:1500px; }

  /* 节点 */
  .node { background:var(--panel); border:1.5px solid rgba(148,163,184,0.15); border-radius:12px; padding:10px 16px; font-size:12px; font-weight:500; cursor:pointer; transition:all .2s cubic-bezier(.4,0,.2,1); position:relative; box-shadow:0 2px 8px rgba(0,0,0,0.2); min-width:130px; text-align:center; user-select:none; }
  .node:hover { transform:translateY(-3px); box-shadow:0 8px 24px rgba(0,0,0,0.35); border-color:rgba(148,163,184,0.3); z-index:10; }
  .node.active { transform:translateY(-3px) scale(1.05); box-shadow:0 12px 32px rgba(0,0,0,0.4); z-index:20; }
  .node.dim { opacity:0.2; }
  .node .node-icon { font-size:15px; margin-bottom:3px; display:block; }
  .node .node-label { display:block; line-height:1.35; }
  .node .node-sub { font-size:10px; color:var(--muted); margin-top:2px; display:block; line-height:1.3; }

  /* 层颜色 */
  .layer-external .node { border-color:rgba(59,130,246,0.3); background:rgba(59,130,246,0.07); }
  .layer-external .node:hover, .layer-external .node.active { border-color:#3b82f6; background:rgba(59,130,246,0.14); }
  .layer-store .node { border-color:rgba(245,158,11,0.3); background:rgba(245,158,11,0.07); }
  .layer-store .node:hover, .layer-store .node.active { border-color:#f59e0b; background:rgba(245,158,11,0.14); }
  .layer-infra .node { border-color:rgba(236,72,153,0.3); background:rgba(236,72,153,0.07); }
  .layer-infra .node:hover, .layer-infra .node.active { border-color:#ec4899; background:rgba(236,72,153,0.14); }
  .layer-core .node { border-color:rgba(99,102,241,0.3); background:rgba(99,102,241,0.07); }
  .layer-core .node:hover, .layer-core .node.active { border-color:#6366f1; background:rgba(99,102,241,0.14); }
  .layer-schema .node { border-color:rgba(168,85,247,0.3); background:rgba(168,85,247,0.07); }
  .layer-schema .node:hover, .layer-schema .node.active { border-color:#a855f7; background:rgba(168,85,247,0.14); }
  .layer-domain .node { border-color:rgba(34,197,94,0.3); background:rgba(34,197,94,0.07); }
  .layer-domain .node:hover, .layer-domain .node.active { border-color:#22c55e; background:rgba(34,197,94,0.14); }
  .layer-service .node { border-color:rgba(249,115,22,0.3); background:rgba(249,115,22,0.07); }
  .layer-service .node:hover, .layer-service .node.active { border-color:#f97316; background:rgba(249,115,22,0.14); }
  .layer-api .node { border-color:rgba(20,184,166,0.3); background:rgba(20,184,166,0.07); }
  .layer-api .node:hover, .layer-api .node.active { border-color:#14b8a6; background:rgba(20,184,166,0.14); }
  .layer-frontend .node { border-color:rgba(239,68,68,0.3); background:rgba(239,68,68,0.07); }
  .layer-frontend .node:hover, .layer-frontend .node.active { border-color:#ef4444; background:rgba(239,68,68,0.14); }

  .hint { position:fixed; bottom:16px; left:50%; transform:translateX(-50%); background:rgba(11,17,32,0.9); border:1px solid rgba(148,163,184,0.15); padding:8px 20px; border-radius:20px; font-size:11.5px; color:var(--muted); z-index:1000; pointer-events:none; }

  @media (max-width:768px) {
    .sidebar-left { display:none; }
    .sidebar-right { width:100%; right:-100%; }
    .toolbar h1 { font-size:13px; }
  }
  @media print { .sidebar-left,.sidebar-right,.toolbar,.hint { display:none; } .viewport { position:static; overflow:visible; } .canvas { transform:none !important; } }
</style>
</head>

function getNodeCenter(id) {
  const el = document.querySelector(`[data-id="${id}"]`);
  if(!el) return null;
  const canvasRect = document.getElementById('canvas').getBoundingClientRect();
  const rect = el.getBoundingClientRect();
  return {
    x: rect.left + rect.width/2 - canvasRect.left,
    y: rect.top + rect.height/2 - canvasRect.top
  };
}

function drawPath(a, b, color, bidirectional) {
  const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
  const dy = b.y - a.y;
  const c1 = { x: a.x, y: a.y + dy * 0.5 };
  const c2 = { x: b.x, y: b.y - dy * 0.5 };
  const d = `M ${a.x} ${a.y} C ${c1.x} ${c1.y}, ${c2.x} ${c2.y}, ${b.x} ${b.y}`;
  path.setAttribute('d', d);
  path.setAttribute('stroke', color);
  path.setAttribute('class', 'conn-path');
  path.setAttribute('marker-end', 'url(#arrow)');
  if(bidirectional) path.setAttribute('marker-start', 'url(#arrow)');
  connectionsSvg.appendChild(path);
}

function drawConnections() {
  connectionsSvg.innerHTML = '<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="rgba(148,163,184,0.4)"/></marker></defs>';

  layerConnections.forEach(conn => {
    if(conn.direct) {
      const a = getNodeCenter(conn.from);
      const b = getNodeCenter(conn.to);
      if(a && b) drawPath(a, b, conn.color, false);
    } else {
      const fromNodes = document.querySelectorAll(`.layer-${conn.fromLayer} .node`);
      const toNodes = document.querySelectorAll(`.layer-${conn.toLayer} .node`);
      if(!fromNodes.length || !toNodes.length) return;
      const fromCenters = Array.from(fromNodes).map(n => getNodeCenter(n.dataset.id)).filter(Boolean);
      const toCenters = Array.from(toNodes).map(n => getNodeCenter(n.dataset.id)).filter(Boolean);
      const sampleFrom = fromCenters.filter((_,i) => i % Math.ceil(fromCenters.length/4) === 0);
      const sampleTo = toCenters.filter((_,i) => i % Math.ceil(toCenters.length/4) === 0);
      sampleFrom.forEach((a, i) => {
        const b = sampleTo[i % sampleTo.length];
        if(a && b) drawPath(a, b, conn.color, conn.bidirectional);
      });
    }
  });
}

// ==================== 交互 ====================
let scale = 1, panX = 0, panY = 0;
let isDragging = false, dragStartX, dragStartY, startPanX, startPanY;
const viewport = document.getElementById('viewport');
const canvas = document.getElementById('canvas');
const zoomDisplay = document.getElementById('zoomDisplay');

function updateTransform() {
  canvas.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
  zoomDisplay.textContent = Math.round(scale * 100) + '%';
}

function zoomIn() { scale = Math.min(scale * 1.2, 3); updateTransform(); }
function zoomOut() { scale = Math.max(scale / 1.2, 0.2); updateTransform(); }
function resetView() { scale = 1; panX = 0; panY = 0; updateTransform(); }

function fitToScreen() {
  const vpRect = viewport.getBoundingClientRect();
  const contentRect = layersContainer.getBoundingClientRect();
  const padding = 80;
  const scaleX = (vpRect.width - padding*2) / contentRect.width;
  const scaleY = (vpRect.height - padding*2) / contentRect.height;
  scale = Math.min(scaleX, scaleY, 1);
  panX = (vpRect.width - contentRect.width * scale) / 2;
  panY = (vpRect.height - contentRect.height * scale) / 2 + 30;
  updateTransform();
}

viewport.addEventListener('wheel', e => {
  e.preventDefault();
  const delta = e.deltaY > 0 ? 0.9 : 1.1;
  const newScale = Math.min(Math.max(scale * delta, 0.2), 3);
  const rect = viewport.getBoundingClientRect();
  const mx = e.clientX - rect.left, my = e.clientY - rect.top;
  panX = mx - (mx - panX) * (newScale / scale);
  panY = my - (my - panY) * (newScale / scale);
  scale = newScale;
  updateTransform();
}, { passive: false });

viewport.addEventListener('mousedown', e => {
  if(e.target.closest('.node')) return;
  isDragging = true;
  dragStartX = e.clientX; dragStartY = e.clientY;
  startPanX = panX; startPanY = panY;
  viewport.classList.add('grabbing');
});

window.addEventListener('mousemove', e => {
  if(!isDragging) return;
  panX = startPanX + (e.clientX - dragStartX);
  panY = startPanY + (e.clientY - dragStartY);
  updateTransform();
});

window.addEventListener('mouseup', () => { isDragging = false; viewport.classList.remove('grabbing'); });

// 触摸支持
let touchStartDist = 0, touchStartScale = 1;
viewport.addEventListener('touchstart', e => {
  if(e.touches.length === 2) {
    touchStartDist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
    touchStartScale = scale;
  }
});
viewport.addEventListener('touchmove', e => {
  if(e.touches.length === 2) {
    e.preventDefault();
    const dist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
    scale = Math.min(Math.max(touchStartScale * (dist / touchStartDist), 0.2), 3);
    updateTransform();
  }
}, { passive: false });

let activeNodeId = null;

function selectNode(id) {
  activeNodeId = id;
  document.querySelectorAll('.node').forEach(n => {
    n.classList.toggle('active', n.dataset.id === id);
    n.classList.toggle('dim', n.dataset.id !== id);
  });
  showDetail(id);
}

function showDetail(id) {
  const nodeEl = document.querySelector(`[data-id="${id}"]`);
  const layer = architectureData.layers.find(l => l.id === nodeEl.dataset.layer);
  const node = layer.nodes.find(n => n.id === id);
  const detail = nodeDetails[id] || getDefaultDetail(node);

  const panel = document.getElementById('detailPanel');
  const content = document.getElementById('detailContent');

  content.innerHTML = `
    <div class="detail-header">
      <span class="detail-tag" style="background:${detail.tagColor}20;color:${detail.tagColor};border:1px solid ${detail.tagColor}40">${detail.tag}</span>
      <div class="detail-title">${node.icon} ${node.label}</div>
      <div class="detail-desc">${detail.desc}</div>
    </div>
    <div class="detail-section">
      <h4>详细信息</h4>
      <ul class="detail-list">
        ${detail.items.map(item => `<li style="border-left-color:${detail.tagColor}60">${item}</li>`).join('')}
      </ul>
    </div>
    <div class="detail-section">
      <h4>所属层级</h4>
      <div style="font-size:12.5px;color:var(--muted)">${layer.name}</div>
    </div>
  `;
  panel.classList.add('open');
}

function closeDetail() {
  document.getElementById('detailPanel').classList.remove('open');
  document.querySelectorAll('.node').forEach(n => n.classList.remove('active', 'dim'));
  activeNodeId = null;
}

viewport.addEventListener('click', e => {
  if(e.target === viewport || e.target === canvas || e.target.id === 'connections') closeDetail();
});

// ==================== 层级过滤 ====================
const layerVisibility = {};
architectureData.layers.forEach(l => layerVisibility[l.id] = true);

function toggleLayer(layerId) {
  layerVisibility[layerId] = !layerVisibility[layerId];
  const layerEl = document.querySelector(`.layer-${layerId}`);
  const legendItem = document.querySelector(`.legend-item[data-layer="${layerId}"]`);
  if(layerVisibility[layerId]) {
    layerEl.style.display = 'flex';
    legendItem.classList.remove('hidden');
  } else {
    layerEl.style.display = 'none';
    legendItem.classList.add('hidden');
  }
  setTimeout(drawConnections, 100);
}

// ==================== 帮助 ====================
let helpVisible = false;
function toggleHelp() {
  helpVisible = !helpVisible;
  document.getElementById('helpBtn').classList.toggle('active', helpVisible);
  document.getElementById('hint').style.display = helpVisible ? 'block' : 'none';
}

// ==================== 初始化 ====================
window.addEventListener('load', () => {
  setTimeout(() => { drawConnections(); fitToScreen(); }, 200);
});

window.addEventListener('resize', () => { drawConnections(); });

document.addEventListener('keydown', e => {
  if(e.key === 'Escape') closeDetail();
  if(e.key === '+' || e.key === '=') zoomIn();
  if(e.key === '-') zoomOut();
  if(e.key === '0') resetView();
  if(e.key === 'f' || e.key === 'F') fitToScreen();
});
