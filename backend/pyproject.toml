[project]
name = "cscec-smart-safety-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "sqlalchemy>=2.0.0",
  "alembic>=1.13.0",
  "pymysql>=1.1.0",
  "pydantic-settings>=2.4.0",
  "httpx>=0.27.0",
  "redis>=5.0.0",
  "sqlglot>=25.0.0",
  "PyJWT>=2.8.0",
  "bcrypt>=4.1.0",
  "pymilvus>=2.4.0",
  "neo4j>=5.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "--basetemp=.pytest_tmp"
