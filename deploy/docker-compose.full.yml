services:
  mysql:
    image: mysql:8.0
    container_name: cscec_safety_mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-275874}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-intelligent_security_platform}
    ports:
      - "3306:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:7
    container_name: cscec_safety_redis
    ports:
      - "6379:6379"
    command:
      - redis-server
      - --appendonly
      - "yes"
    volumes:
      - redis_data:/data

volumes:
  mysql_data:
  redis_data:
