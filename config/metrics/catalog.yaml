  - 作业证异常工人数
  - worker_cert_abnormal_count
- metric_code: WORKER_VIOLATION_30D_COUNT
  metric_name: 近30天工人违规次数
  business_definition: 工人近30天累计违规次数。
  calculation_formula: sum(violation_count_30d)
  statistical_period: 30d
  dimensions:
  - tenant_id
  - project_id
  - subcontractor_id
  source_tables:
  - worker
  source_fields:
  - violation_count_30d
  filters:
    status: active
  permission_level: project
  owner_department: 安全部
  metric_version: v1.0
  status: enabled
  aliases:
  - 近30天工人违规次数
  - worker_violation_30d_count
- metric_code: WORKER_FREQUENT_VIOLATION_COUNT
  metric_name: 频繁违规工人数
  business_definition: 近30天违规次数大于等于3的工人数量。
  calculation_formula: count(worker_id where violation_count_30d >= 3)
  statistical_period: 30d
  dimensions:
  - tenant_id
  - project_id
  - subcontractor_id
  source_tables:
  - worker
  source_fields:
  - worker_id
  - violation_count_30d
  filters:
    violation_count_30d_gte: 3
  permission_level: project
  owner_department: 安全部
  metric_version: v1.0
  status: enabled
  aliases:
  - 频繁违规工人数
  - worker_frequent_violation_count
- metric_code: TRAINING_PASS_RATE
  metric_name: 培训合格率
  business_definition: 安全培训考核合格工人数占应培训人数比例。
