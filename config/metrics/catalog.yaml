metrics:
- metric_code: PROJECT_RISK_SCORE
  metric_name: 项目风险分
  business_definition: 项目基础风险分乘以动态修正系数后叠加强规则触发分。
  calculation_formula: base_score * dynamic_factor + rule_bonus
  statistical_period: daily
  dimensions:
  - tenant_id
  - org_path
  - project_id
  - calc_date
  source_tables:
  - project_risk_profile
  source_fields:
  - total_risk_score
  - risk_level
  - strong_rule_flags
  filters:
    status: active
  permission_level: project
  owner_department: 安全部
  metric_version: v1.0
  status: enabled
  aliases:
  - 项目风险分
  - 项目风险
  - 风险分
- metric_code: PROJECT_HIGH_RISK_COUNT
  metric_name: 高风险项目数
  business_definition: 当前风险等级为 high 或 critical 的项目数量。
  calculation_formula: count(project_id where risk_level in high,critical)
  statistical_period: daily
  dimensions:
  - tenant_id
  - org_path
  - calc_date
  source_tables:
  - project_risk_profile
  source_fields:
  - project_id
  - risk_level
  filters:
    risk_level:
    - high
    - critical
  permission_level: tenant
  owner_department: 安全部
  metric_version: v1.0
  status: enabled
  aliases:
  - 高风险项目数
  - project_high_risk_count
- metric_code: PROJECT_CRITICAL_RISK_COUNT
  metric_name: 极高风险项目数
  business_definition: 当前风险等级为 critical 的项目数量。
  calculation_formula: count(project_id where risk_level = critical)
  statistical_period: daily
  dimensions:
  - tenant_id
  - org_path
  - calc_date
  source_tables:
  - project_risk_profile
  source_fields:
  - project_id
  - risk_level
  filters:
    risk_level: critical
  permission_level: tenant
  owner_department: 安全部
  metric_version: v1.0
  status: enabled
  aliases:
  - 极高风险项目数
  - project_critical_risk_count
- metric_code: PROJECT_HAZARD_OVERDUE_RATE
  metric_name: 隐患整改超期率
  business_definition: 超期未关闭隐患数占应整改隐患数的比例。
  calculation_formula: overdue_open_hazards / total_open_or_due_hazards
  statistical_period: daily
  dimensions:
  - tenant_id
  - project_id
  - subcontractor_id
  source_tables:
  - hazard
  source_fields:
  - due_date
  - status
  - close_date
  filters:
    status_not: closed
  permission_level: project
  owner_department: 安全部
  metric_version: v1.0
  status: enabled
  aliases:
  - 隐患整改超期率
  - project_hazard_overdue_rate
- metric_code: PROJECT_MAJOR_HAZARD_COUNT
  metric_name: 重大隐患数量
  business_definition: 统计周期内项目重大隐患数量。
  calculation_formula: count(hazard_id where is_major = true)
  statistical_period: daily
  dimensions:
  - tenant_id
  - project_id
  source_tables:
  - hazard
  source_fields:
  - hazard_id
  - is_major
  filters:
    is_major: true
  permission_level: project
  owner_department: 安全部
  metric_version: v1.0
  status: enabled
  aliases:
  - 重大隐患数量
  - project_major_hazard_count
- metric_code: PROJECT_MAJOR_HAZARD_OVERDUE_COUNT
  metric_name: 重大隐患超期未闭环数
  business_definition: 到期后仍未关闭的重大隐患数量。
  calculation_formula: count(hazard_id where is_major = true and due_date < today
    and status != closed)
  statistical_period: daily
  dimensions:
  - tenant_id
  - project_id
  source_tables:
  - hazard
  source_fields:
  - hazard_id
  - is_major
  - due_date
  - status
  filters:
    is_major: true
    status_not: closed
  permission_level: project
  owner_department: 安全部
  metric_version: v1.0
  status: enabled
  aliases:
  - 重大隐患超期未闭环数
  - project_major_hazard_overdue_count
- metric_code: PROJECT_OPEN_HAZARD_COUNT
  metric_name: 未闭环隐患数
  business_definition: 当前未关闭隐患数量。
  calculation_formula: count(hazard_id where status != closed)
  statistical_period: daily
  dimensions:
  - tenant_id
  - project_id
  - subcontractor_id
  source_tables:
  - hazard
  source_fields:
  - hazard_id
  - status
  filters:
    status_not: closed
  permission_level: project
  owner_department: 安全部
  metric_version: v1.0
  status: enabled
  aliases:
  - 未闭环隐患数
  - project_open_hazard_count
- metric_code: HAZARD_RECTIFICATION_CLOSE_RATE
  metric_name: 隐患整改闭环率
  business_definition: 已关闭隐患数占隐患总数的比例。
  calculation_formula: closed_hazards / total_hazards
  statistical_period: monthly
  dimensions:
  - tenant_id
  - project_id
  - subcontractor_id
  source_tables:
  - hazard
  source_fields:
  - hazard_id
  - status
  filters: {}
  permission_level: project
  owner_department: 安全部
  metric_version: v1.0
  status: enabled
  aliases:
  - 隐患整改闭环率
  - hazard_rectification_close_rate
- metric_code: EQUIPMENT_OVERDUE_RATE
  metric_name: 设备超期未检率
  business_definition: 超期未检在用设备数占在用设备数的比例。
  calculation_formula: overdue_in_use_equipment / in_use_equipment
  statistical_period: daily
  dimensions:
  - tenant_id
  - project_id
  - equipment_type
  source_tables:
  - equipment
  source_fields:
  - inspection_due_date
  - use_status
  filters:
    use_status: in_use
  permission_level: project
  owner_department: 设备部
  metric_version: v1.0
  status: enabled
  aliases:
  - 设备超期未检率
  - equipment_overdue_rate
- metric_code: SPECIAL_EQUIPMENT_OVERDUE_COUNT
  metric_name: 特种设备超期未检数
  business_definition: 在用且检验日期已超期的特种设备数量。
  calculation_formula: count(equipment_id where is_special = true and inspection_due_date
    < today and use_status = in_use)
  statistical_period: daily
  dimensions:
  - tenant_id
  - project_id
  - equipment_type
  source_tables:
  - equipment
  source_fields:
  - equipment_id
  - is_special
  - inspection_due_date
  - use_status
  filters:
    is_special: true
    use_status: in_use
  permission_level: project
  owner_department: 设备部
  metric_version: v1.0
  status: enabled
  aliases:
  - 特种设备超期未检数
  - special_equipment_overdue_count
- metric_code: EQUIPMENT_IN_USE_COUNT
  metric_name: 在用设备数量
  business_definition: 当前处于在用状态的设备数量。
  calculation_formula: count(equipment_id where use_status = in_use)
  statistical_period: daily
  dimensions:
  - tenant_id
  - project_id
  - equipment_type
  source_tables:
  - equipment
  source_fields:
  - equipment_id
  - use_status
  filters:
    use_status: in_use
  permission_level: project
  owner_department: 设备部
  metric_version: v1.0
  status: enabled
  aliases:
  - 在用设备数量
  - equipment_in_use_count
- metric_code: WORKER_HIGH_RISK_RATIO
  metric_name: 高风险工人占比
  business_definition: 高风险或极高风险工人占在场工人的比例。
  calculation_formula: high_risk_workers / active_workers
  statistical_period: daily
  dimensions:
  - tenant_id
  - project_id
  - subcontractor_id
  source_tables:
  - worker
  - worker_risk_profile
  source_fields:
  - worker_id
  - risk_level
  - status
  filters:
    risk_level:
    - high
    - critical
    status: active
  permission_level: project
  owner_department: 劳务管理部
  metric_version: v1.0
  status: enabled
  aliases:
  - 高风险工人占比
  - 高风险工人比例
- metric_code: WORKER_CERT_ABNORMAL_COUNT
  metric_name: 作业证异常工人数
  business_definition: 特种作业证过期或缺失的工人数量。
  calculation_formula: count(worker_id where special_cert_status in expired,missing)
