      properties:
        session_id:
          type: string
          maxLength: 64
          minLength: 1
          title: Session Id
        message:
          $ref: '#/components/schemas/MemoryMessage'
        context:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Context
        summary:
          anyOf:
          - type: string
          - type: 'null'
          title: Summary
      type: object
      required:
      - session_id
      - message
      title: MemorySessionUpsertRequest
