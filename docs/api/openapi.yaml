          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    AttributionRequest:
      properties:
        project_id:
          type: string
          minLength: 1
          maxLength: 64
          title: Project Id
        worker_id:
          anyOf:
          - type: string
            maxLength: 64
          - type: 'null'
          title: Worker Id
        subcontractor_id:
          anyOf:
          - type: string
            maxLength: 64
          - type: 'null'
          title: Subcontractor Id
        accident_type:
          anyOf:
          - type: string
            maxLength: 64
          - type: 'null'
          title: Accident Type
