          type: string
        need_human_review:
          type: boolean
        project_id:
          type: string
        worker_id:
          anyOf:
          - type: string
          - type: 'null'
        subcontractor_id:
          anyOf:
          - type: string
          - type: 'null'
        accident_type:
          anyOf:
          - type: string
          - type: 'null'
        risk_level:
          anyOf:
          - type: string
          - type: 'null'
        factor_contributions:
          type: array
          items:
            type: object
            additionalProperties: true
        accident_type_probabilities:
          type: array
          items:
            type: object
            additionalProperties: true
        control_priorities:
          type: array
          items:
            type: string
        evidence:
          type: array
          items:
            type: object
            additionalProperties: true
        disclaimer:
          type: string
        case_count:
          type: integer
        requested_model_level:
          type: string
        resolved_model_level:
          type: string
        propagation_paths:
          type: array
          items:
            type: object
            additionalProperties: true
          description: Present when resolved_model_level=L3
        cpt_version:
          anyOf:
          - type: string
          - type: 'null'
        structure_version:
          anyOf:
          - type: string
          - type: 'null'
        calibration_hint:
          anyOf:
          - type: string
          - type: 'null'
        graph_supplemental_evidence:
