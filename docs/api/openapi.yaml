  /api/v1/analysis/attribution:
    post:
      tags:
      - analysis
      summary: Bayesian Attribution
      description: |
        L2 expert-prior attribution by default. When `model_level=auto` and tenant has
        >=200 active accident cases plus a learned CPT, resolves to L3 with propagation paths.
        L3 may append low-weight Neo4j neighbor evidence when `NEO4J_ENABLED=true`.
      operationId: attribution_analysis_api_v1_analysis_attribution_post
      parameters:
      - name: X-Mock-User-Id
        in: header
        required: false
        schema:
          type: string
          default: mock-admin
      - name: X-Tenant-Id
        in: header
        required: false
        schema:
          type: string
          default: CSCEC
      - name: X-Org-Path
        in: header
        required: false
        schema:
          type: string
          default: CSCEC
      - name: X-Role
        in: header
        required: false
        schema:
          type: string
          default: platform_admin
      - name: X-Data-Scope
        in: header
        required: false
        schema:
          type: string
          default: tenant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttributionRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttributionSuccessResponse'
        '403':
          description: Forbidden
        '404':
          description: Project profile not found
        '503':
          description: Bayesian gate not met (insufficient cases or missing CPT)
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
